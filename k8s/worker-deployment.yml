apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: job-queue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: job-queue-worker:latest
          imagePullPolicy: Never