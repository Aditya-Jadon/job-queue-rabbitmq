services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: job-queue-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:latest
    container_name: job-queue-postgres
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jobqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: ./worker
    container_name: job-queue-worker
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
  
  producer:
    build: ./producer
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data: